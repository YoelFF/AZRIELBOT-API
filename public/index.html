<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AZRIELBOT API</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
color:#fff;
overflow-x:hidden;
text-align:center;
}

/* Fondo */

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("https://i.postimg.cc/P584VwS6/ce82d0135090887995fca223e012d2d7.jpg") center/cover;
filter:blur(12px);
opacity:.35;
transform:scale(1.1);
z-index:-2;
}

body::after{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.55);
z-index:-1;
}

/* Imagen */

.banner{
margin-top:35px;
}

.banner img{
width:90%;
max-width:750px;
border-radius:25px;
box-shadow:0 0 40px #00ff88;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* Tarjetas */

.card{
width:92%;
max-width:800px;
margin:30px auto;
padding:25px;
background:rgba(20,20,20,.55);
backdrop-filter:blur(15px);
border-radius:20px;
box-shadow:0 0 25px rgba(0,255,136,.3);
}

.card h2{
color:#00ff88;
margin-bottom:20px;
}

.endpoint{
background:#111;
padding:15px;
margin:12px 0;
border-radius:12px;
transition:.3s;
}

.endpoint:hover{
background:#00ff88;
}

.endpoint a{
color:#00ff88;
font-size:20px;
text-decoration:none;
font-weight:bold;
}

.endpoint:hover a{
color:#000;
}

/* Texto inferior */

.creditos{
margin:60px 20px;
animation:fade 2s;
}

.creditos h2{
font-size:36px;
color:#00ff88;
text-shadow:0 0 20px #00ff88;
}

.creditos h1{
font-size:55px;
margin-top:15px;
color:#fff;
text-shadow:0 0 25px #00ff88;
}

.creditos p{
margin-top:12px;
font-size:22px;
color:#ddd;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

footer{
margin:50px;
color:#999;
}

</style>

</head>

<body>

<div class="banner">

<img src="https://i.postimg.cc/0j9mG83c/file-00000000ce50820ea2721d7f23143852.png">

</div>

<div class="card">

<h2>📡 ENDPOINTS</h2>

<div class="endpoint">
<a href="/api/facto">/api/facto</a>
</div>

<div class="endpoint">
<a href="/api/frase">/api/frase</a>
</div>

<div class="endpoint">
<a href="/api">/api</a>
</div>

</div>

<div class="creditos">

<h2>Creador de la página</h2>

<h1>Yoel</h1>

<p>Desarrollador de AzrielBotV4</p>

</div>

<footer>

© 2026 AZRIELBOT API

</footer>

</body>
</html>
